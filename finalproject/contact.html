    <title>Contact Us – Modest Muse Fashion</title>
    <meta name="description"
        content="Get in touch with Modest Muse Fashion. Send us a message, and we'll respond promptly.">

    <link rel="icon" type="image/png" href="/wdd231/finalproject/images/favicon.png">

    <!-- CSS -->

<body>

    <header>
        <h1>Contact Us</h1>
        <button id="hamburger" aria-label="Toggle navigation menu">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Send a Message</h2>

        <form id="contactForm">
            <fieldset>
                <legend>Your Information</legend>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </fieldset>

            <button type="submit">Submit</button>
        </form>

    </main>

    <footer>
        <div>
            <p><strong>Modest Muse Fashion</strong></p>
            <p>South Korea, Seoul 999</p>
            <p>info@mmf.org</p>
            <p>(223) 555-2300</p>
        </div>

        <div class="social">
            <a href="https://github.com/britneyliamaulana" target="_blank" aria-label="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/britneymaulana/" target="_blank" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin"></i>
            </a>
            <a href="https://instagram.com/britneyslia" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="mailto:maulanathandeka@gmail.com" aria-label="Email">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>

        <div>

            <a href="references.html">References</a>
